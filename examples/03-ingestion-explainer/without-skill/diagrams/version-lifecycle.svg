<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="430" viewBox="0 0 1240 430" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" role="img"><title>Catalog status of one Version</title><desc>A Version starts as received (set by the Uploader API). The Validation Worker moves it to validated if the file passes or to quarantined if it fails. The Transform Worker moves a validated Version to published. A quarantined file is fixed by the owner and re-uploaded, which creates a new Version that starts at received.</desc><defs><marker id="m-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7B4EA3"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker></defs><rect width="1240" height="430" fill="#FFFFFF"/><text x="24" y="32" text-anchor="start" font-size="14" font-weight="600" fill="#6B7280">CATALOG STATUS OF ONE VERSION</text><rect x="170" y="78" width="236" height="96" rx="12" fill="#DCEBFA" stroke="#2F6EB5" stroke-width="1.8"/><text x="288.0" y="111.0" text-anchor="middle" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="21" font-weight="600" fill="#1F2937">received</text><text x="288.0" y="133.0" text-anchor="middle" font-size="16" fill="#374151">file stored in Raw Zone,</text><text x="288.0" y="154.0" text-anchor="middle" font-size="16" fill="#374151">validate message queued</text><rect x="566" y="78" width="236" height="96" rx="12" fill="#DCEBFA" stroke="#2F6EB5" stroke-width="1.8"/><text x="684.0" y="111.0" text-anchor="middle" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="21" font-weight="600" fill="#1F2937">validated</text><text x="684.0" y="133.0" text-anchor="middle" font-size="16" fill="#374151">file matches its contract,</text><text x="684.0" y="154.0" text-anchor="middle" font-size="16" fill="#374151">transform message queued</text><rect x="962" y="78" width="236" height="96" rx="12" fill="#E4F3DA" stroke="#4C8C2B" stroke-width="1.8"/><text x="1080.0" y="111.0" text-anchor="middle" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="21" font-weight="600" fill="#1F2937">published</text><text x="1080.0" y="133.0" text-anchor="middle" font-size="16" fill="#374151">tables in Curated Zone,</text><text x="1080.0" y="154.0" text-anchor="middle" font-size="16" fill="#374151">Lineage record written</text><rect x="566" y="246" width="236" height="96" rx="12" fill="#FDE9E7" stroke="#C0392B" stroke-width="1.8"/><text x="684.0" y="279.0" text-anchor="middle" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="21" font-weight="600" fill="#1F2937">quarantined</text><text x="684.0" y="301.0" text-anchor="middle" font-size="16" fill="#374151">copy in Quarantine Store,</text><text x="684.0" y="322.0" text-anchor="middle" font-size="16" fill="#374151">owner told why</text><circle cx="36" cy="126.0" r="9" fill="#374151"/><path d="M46,126.0 H170" fill="none" stroke="#374151" stroke-width="2.2" marker-end="url(#m-dark)"/><text x="108.0" y="114.0" text-anchor="middle" font-size="17" font-weight="400" fill="#1F2937">Uploader API</text><path d="M406,126.0 H566" fill="none" stroke="#374151" stroke-width="2.2" marker-end="url(#m-dark)"/><text x="486.0" y="93.0" text-anchor="middle" font-size="17" font-weight="400" fill="#1F2937">Validation Worker:</text><text x="486.0" y="114.0" text-anchor="middle" font-size="17" font-weight="400" fill="#1F2937">file passes</text><path d="M802,126.0 H962" fill="none" stroke="#374151" stroke-width="2.2" marker-end="url(#m-dark)"/><text x="882.0" y="93.0" text-anchor="middle" font-size="17" font-weight="400" fill="#1F2937">Transform Worker:</text><text x="882.0" y="114.0" text-anchor="middle" font-size="17" font-weight="400" fill="#1F2937">done</text><path d="M290,174 V294.0 H566" fill="none" stroke="#C0392B" stroke-width="2.2" marker-end="url(#m-red)"/><text x="428.0" y="267.0" text-anchor="middle" font-size="17" font-weight="400" fill="#C0392B">Validation Worker:</text><text x="428.0" y="287.0" text-anchor="middle" font-size="17" font-weight="400" fill="#C0392B">file fails</text><path d="M684.0,342 V396 H234 V174" fill="none" stroke="#374151" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#m-dark)"/><text x="459.0" y="365" text-anchor="middle" font-size="17" font-weight="400" fill="#1F2937">Owner fixes the file and re-uploads:</text><text x="459.0" y="385" text-anchor="middle" font-size="17" font-weight="400" fill="#1F2937">a new Version starts at <tspan font-family="Consolas,'Cascadia Mono','Courier New',monospace">received</tspan></text></svg>
