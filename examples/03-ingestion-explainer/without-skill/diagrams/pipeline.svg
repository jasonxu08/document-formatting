<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="925" viewBox="0 0 1380 925" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" role="img"><title>Ingestion platform map</title><desc>A customer uploads to the Uploader API, which checks the Policy Engine, streams the file into the Raw Zone, records the Version in the Catalog and queues a validate message. The Validation Worker checks the file against its Schema contract from the Schema Registry; a pass queues a transform message, a failure copies the file to the Quarantine Store and notifies the owner. The Transform Worker writes the Curated Zone, records lineage and published status in the Catalog and notifies the owner.</desc><defs><marker id="m-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7B4EA3"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker></defs><rect width="1380" height="925" fill="#FFFFFF"/><rect x="0" y="10" width="1380" height="286" rx="12" fill="#F5F7FA"/><text transform="translate(26 153.0) rotate(-90)" text-anchor="middle" font-size="14" font-weight="600" letter-spacing="2" fill="#6B7280">SUPPORTING SERVICES</text><rect x="0" y="306" width="1380" height="180" rx="12" fill="#F5F7FA"/><text transform="translate(26 396.0) rotate(-90)" text-anchor="middle" font-size="14" font-weight="600" letter-spacing="2" fill="#6B7280">PIPELINE</text><rect x="0" y="496" width="1380" height="304" rx="12" fill="#F5F7FA"/><text transform="translate(26 648.0) rotate(-90)" text-anchor="middle" font-size="14" font-weight="600" letter-spacing="2" fill="#6B7280">STORAGE</text><rect x="160" y="30" width="1180" height="62" rx="12" fill="#F1E8FA" stroke="#7B4EA3" stroke-width="1.8"/><text x="750.0" y="56.5" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="600" fill="#1F2937">Catalog</text><text x="750.0" y="78.5" text-anchor="middle" font-size="16" fill="#374151">metadata store, source of truth for status: datasets, Versions, lineage, owners</text><rect x="160" y="716" width="1180" height="62" rx="12" fill="#E4F3DA" stroke="#4C8C2B" stroke-width="1.8"/><text x="750.0" y="742.5" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="600" fill="#1F2937">Raw Zone</text><text x="750.0" y="764.5" text-anchor="middle" font-size="16" fill="#374151">immutable blob storage; keeps the original upload for 1 year</text><rect x="145" y="172" width="170" height="60" rx="12" fill="#F1E8FA" stroke="#7B4EA3" stroke-width="1.8"/><text x="230.0" y="197.5" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="600" fill="#1F2937">Policy Engine</text><text x="230.0" y="219.5" text-anchor="middle" font-size="16" fill="#374151">access decisions</text><rect x="572" y="172" width="176" height="60" rx="12" fill="#F1E8FA" stroke="#7B4EA3" stroke-width="1.8"/><text x="660.0" y="197.5" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="600" fill="#1F2937">Schema Registry</text><text x="660.0" y="219.5" text-anchor="middle" font-size="16" fill="#374151">Schema contracts</text><rect x="915" y="172" width="170" height="60" rx="12" fill="#F1E8FA" stroke="#7B4EA3" stroke-width="1.8"/><text x="1000.0" y="197.5" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="600" fill="#1F2937">Notifier</text><text x="1000.0" y="219.5" text-anchor="middle" font-size="16" fill="#374151">fire-and-forget</text><rect x="190" y="360" width="200" height="70" rx="12" fill="#DCEBFA" stroke="#2F6EB5" stroke-width="1.8"/><text x="290.0" y="390.5" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="600" fill="#1F2937">Uploader API</text><text x="290.0" y="412.5" text-anchor="middle" font-size="16" fill="#374151">only public entry point</text><rect x="435" y="360" width="160" height="70" rx="12" fill="#FFF1CC" stroke="#B7791F" stroke-width="1.8"/><text x="515.0" y="390.5" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="600" fill="#1F2937">Message Queue</text><text x="515.0" y="412.5" text-anchor="middle" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="16" fill="#374151">validate</text><rect x="640" y="360" width="205" height="70" rx="12" fill="#DCEBFA" stroke="#2F6EB5" stroke-width="1.8"/><text x="742.5" y="401.0" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="600" fill="#1F2937">Validation Worker</text><rect x="900" y="360" width="160" height="70" rx="12" fill="#FFF1CC" stroke="#B7791F" stroke-width="1.8"/><text x="980.0" y="390.5" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="600" fill="#1F2937">Message Queue</text><text x="980.0" y="412.5" text-anchor="middle" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="16" fill="#374151">transform</text><rect x="1105" y="360" width="205" height="70" rx="12" fill="#DCEBFA" stroke="#2F6EB5" stroke-width="1.8"/><text x="1207.5" y="401.0" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="600" fill="#1F2937">Transform Worker</text><rect x="575" y="556" width="170" height="70" rx="12" fill="#FDE9E7" stroke="#C0392B" stroke-width="1.8"/><text x="660.0" y="586.5" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="600" fill="#1F2937">Quarantine Store</text><text x="660.0" y="608.5" text-anchor="middle" font-size="16" fill="#374151">kept 30 days</text><rect x="1170" y="556" width="170" height="70" rx="12" fill="#E4F3DA" stroke="#4C8C2B" stroke-width="1.8"/><text x="1255.0" y="586.5" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="600" fill="#1F2937">Curated Zone</text><text x="1255.0" y="608.5" text-anchor="middle" font-size="16" fill="#374151">lakehouse tables</text><path d="M52,395 H190" fill="none" stroke="#374151" stroke-width="2.2" marker-end="url(#m-dark)"/><text x="121" y="362" text-anchor="middle" font-size="17" font-weight="400" fill="#1F2937">customer</text><text x="121" y="383" text-anchor="middle" font-size="17" font-weight="400" fill="#1F2937">upload</text><path d="M390,395 H435" fill="none" stroke="#374151" stroke-width="2.2" marker-end="url(#m-dark)"/><path d="M595,395 H640" fill="none" stroke="#374151" stroke-width="2.2" marker-end="url(#m-dark)"/><path d="M845,395 H900" fill="none" stroke="#374151" stroke-width="2.2" marker-end="url(#m-dark)"/><text x="872.5" y="383" text-anchor="middle" font-size="17" font-weight="400" fill="#1F2937">pass</text><path d="M1060,395 H1105" fill="none" stroke="#374151" stroke-width="2.2" marker-end="url(#m-dark)"/><path d="M230,360 V232" fill="none" stroke="#7B4EA3" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#m-purple)"/><text x="238" y="305" text-anchor="start" font-size="17" font-weight="400" fill="#7B4EA3">may upload?</text><path d="M360,360 V92" fill="none" stroke="#7B4EA3" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#m-purple)"/><text x="368" y="138" text-anchor="start" font-size="17" font-weight="400" fill="#7B4EA3">Version: <tspan font-family="Consolas,'Cascadia Mono','Courier New',monospace">received</tspan></text><path d="M660,360 V232" fill="none" stroke="#7B4EA3" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#m-purple)"/><text x="668" y="305" text-anchor="start" font-size="17" font-weight="400" fill="#7B4EA3">get contract</text><path d="M790,360 V92" fill="none" stroke="#7B4EA3" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#m-purple)"/><text x="798" y="138" text-anchor="start" font-size="17" font-weight="400" fill="#7B4EA3"><tspan font-family="Consolas,'Cascadia Mono','Courier New',monospace">validated</tspan> / <tspan font-family="Consolas,'Cascadia Mono','Courier New',monospace">quarantined</tspan></text><path d="M825,360 L955,232" fill="none" stroke="#7B4EA3" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#m-purple)"/><text x="890" y="338" text-anchor="start" font-size="17" font-weight="400" fill="#7B4EA3">on quarantine</text><path d="M1140,360 L1045,232" fill="none" stroke="#7B4EA3" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#m-purple)"/><text x="1130" y="338" text-anchor="start" font-size="17" font-weight="400" fill="#7B4EA3">on publish</text><path d="M1275,360 V92" fill="none" stroke="#7B4EA3" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#m-purple)"/><text x="1267" y="138" text-anchor="end" font-size="17" font-weight="400" fill="#7B4EA3">lineage + <tspan font-family="Consolas,'Cascadia Mono','Courier New',monospace">published</tspan></text><path d="M230,92 V172" fill="none" stroke="#7B4EA3" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#m-purple)"/><text x="222" y="138" text-anchor="end" font-size="17" font-weight="400" fill="#7B4EA3">who can see a dataset</text><path d="M350,430 V716" fill="none" stroke="#374151" stroke-width="2.2" marker-end="url(#m-dark)"/><text x="358" y="600" text-anchor="start" font-size="17" font-weight="400" fill="#1F2937">stream file</text><path d="M660,430 V556" fill="none" stroke="#C0392B" stroke-width="2.2" marker-end="url(#m-red)"/><text x="668" y="500" text-anchor="start" font-size="17" font-weight="400" fill="#C0392B">fail: copy file</text><path d="M810,716 V430" fill="none" stroke="#374151" stroke-width="2.2" marker-end="url(#m-dark)"/><text x="818" y="640" text-anchor="start" font-size="17" font-weight="400" fill="#1F2937">read</text><path d="M1135,716 V430" fill="none" stroke="#374151" stroke-width="2.2" marker-end="url(#m-dark)"/><text x="1127" y="640" text-anchor="end" font-size="17" font-weight="400" fill="#1F2937">read</text><path d="M1265,430 V556" fill="none" stroke="#374151" stroke-width="2.2" marker-end="url(#m-dark)"/><text x="1257" y="500" text-anchor="end" font-size="17" font-weight="400" fill="#1F2937">write tables</text><path d="M60,842 H110" fill="none" stroke="#374151" stroke-width="2.2" marker-end="url(#m-dark)"/><text x="120" y="848" text-anchor="start" font-size="17" font-weight="400" fill="#1F2937">main data path</text><path d="M290,842 H340" fill="none" stroke="#7B4EA3" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#m-purple)"/><text x="350" y="848" text-anchor="start" font-size="17" font-weight="400" fill="#1F2937">call to a supporting service (label says why)</text><path d="M760,842 H810" fill="none" stroke="#C0392B" stroke-width="2.2" marker-end="url(#m-red)"/><text x="820" y="848" text-anchor="start" font-size="17" font-weight="400" fill="#1F2937">validation failure path</text><text x="60" y="884" text-anchor="start" font-size="15" font-weight="400" fill="#6B7280">The two Message Queue boxes are one queue carrying two message types. After 3 failed attempts a message goes to the DLQ.</text><text x="60" y="906" text-anchor="start" font-size="15" font-weight="400" fill="#6B7280">The Policy Engine is also called by the Curated Zone, for row-level access rules.</text></svg>
